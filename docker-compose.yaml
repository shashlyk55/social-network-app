#version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: innogram-postgres
    environment:
      POSTGRES_USER: postgres_user
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: innogram_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./packages/db/init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres_user -d innogram_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - innogram-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: innogram-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@innogram.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - innogram-network

  redis:
    image: redis:7-alpine
    container_name: innogram-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 20 1 --loglevel warning --requirepass redis_password
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - innogram-network

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: innogram-redis-commander
    environment:
      - REDIS_HOSTS=local:redis:6379:0:redis_password
      - HTTP_USER=admin
      - HTTP_PASSWORD=admin123
      - REDIS_PASSWORD=redis_password
    ports:
      - "8081:8081"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - innogram-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: innogram-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: innogram
      RABBITMQ_DEFAULT_PASS: innogram_password
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - innogram-network

  auth-microservice:
    build:
      context: ./apps/auth_microservice
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3002:3002"
    env_file:
      - ./apps/auth_microservice/auth.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - innogram-network

  core-microservice:
    build:
      context: ./apps/core_microservice
      dockerfile: Dockerfile
    restart: always
    env_file:
      - ./apps/core_microservice/core.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - innogram-network

  notifications-consumer-microservice:
    build:
      context: ./apps/notifications_consumer_microservice
      dockerfile: Dockerfile
    restart: always
    env_file:
      - ./apps/notifications_consumer_microservice/notifications-consumer.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - innogram-network

  nginx:
    image: nginx:1.27.4-bookworm
    ports:
      - "80:80"
    volumes:
      - ./apps/frontend/dist:/usr/share/nginx/html:ro
      - ./apps/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - core-microservice
    networks:
      - innogram-network

volumes:
  postgres_data:
  pgadmin_data:
  redis_data:

networks:
  innogram-network:
    driver: bridge
