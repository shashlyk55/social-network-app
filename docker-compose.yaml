#version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: innogram-postgres
    environment:
      POSTGRES_USER: postgres_user
      POSTGRES_DB: innogam_db
      POSTGRES_PASSWORD: 123
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./packages/db/init-scripts:/docker-entrypoint-initdb.d
    networks:
      - innogram-network

  redis:
    image: redis:7-alpine
    container_name: innogram-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - innogram-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: innogram-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: innogram
      RABBITMQ_DEFAULT_PASS: innogram_password
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - innogram-network

  auth_microservice:
    build:
      context: ./apps/auth_microservice
      dockerfile: Dockerfile
    restart: always
    env_file:
      - ./apps/auth_microservice/auth.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - innogram-network

  core_microservice:
    build:
      context: ./apps/core_microservice
      dockerfile: Dockerfile
    restart: always
    env_file:
      - ./apps/core_microservice/core.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - innogram-network

  notifications_consumer_microservice:
    build:
      context: ./apps/notifications_consumer_microservice
      dockerfile: Dockerfile
    restart: always
    env_file:
      - ./apps/notifications_consumer_microservice/notifications-consumer.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - innogram-network

  nginx:
    image: nginx:1.27.4-bookworm
    ports:
      - "80:80"
    volumes:
      - ./apps/frontend/dist:/usr/share/nginx/html:ro
      - ./apps/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - innogram-network

volumes:
  postgres_data:
  redis_data:

networks:
  innogram-network:
    driver: bridge
