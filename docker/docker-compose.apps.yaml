services:
  auth-microservice:
    build:
      context: ..
      dockerfile: ./apps/auth_microservice/Dockerfile
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "3002:3002"
    env_file:
      - ../apps/auth_microservice/auth.env
    networks:
      - innogram-network

  core-microservice:
    build:
      context: ..
      dockerfile: ./apps/core_microservice/Dockerfile
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    env_file:
      - ../apps/core_microservice/core.env
    networks:
      - innogram-network

  notifications-consumer:
    build:
      context: ..
      dockerfile: ./apps/notifications_consumer_microservice/Dockerfile
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    env_file:
      - ../apps/notifications_consumer_microservice/notifications-consumer.env
    networks:
      - innogram-network

  nginx:
    image: nginx:1.27.4-bookworm
    ports:
      - "80:80"
    volumes:
      - ../apps/frontend-next/dist:/usr/share/nginx/html:ro
      - ../apps/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - core-microservice
    networks:
      - innogram-network

networks:
  innogram-network:
    external: false
